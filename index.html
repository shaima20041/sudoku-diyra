<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>سودوكو الديرة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one RTL column. Najdi skyline header, Sadu weave band, status row, board, number pad, actions, heritage trio. */
:root {
  --font-display: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --bg: #EDF2EC;
  --surface: #FFFFFF;
  --surface-2: #E1EAE0;
  --ink: #14251B;
  --muted: #55675A;
  --line: #C5D1C6;
  --frame: #0F4C2E;
  --green: #12713F;
  --hero: #0B4A2A;
  --hero-ink: #F3F1E6;
  --gold: #C8963E;
  --red: #B8322B;
  --wrong-bg: #F6D9D5;
  --peer: #E3EEE3;
  --same: #F1E1B5;
  --sel: #F5D580;
  --sand: #D2A96B;
  --sand-d: #A8763F;
  --palm: #1C7A47;
  --palm-d: #135733;
  --ink-soft: #2A261F;
  --sadu-bg: #16130F;
  --date: #7A3F1A;
  --brass: #D1A044;
  --brass-d: #94651B;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09150E; --surface: #112219; --surface-2: #18301F; --ink: #E7F0E8; --muted: #93A798;
    --line: #26402F; --frame: #4FB07C; --green: #5CCB8E; --hero: #0D3A22; --gold: #E2B55E;
    --red: #FF7A6E; --wrong-bg: #4A1E1B; --peer: #17301F; --same: #4A3C16; --sel: #6B5415;
    --sand: #C79A5E; --sand-d: #8E6330; --palm: #2F9A5F; --palm-d: #1E7044; --ink-soft: #0A120D;
    --sadu-bg: #070A08; --brass: #E2B55E; --brass-d: #A67A28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09150E; --surface: #112219; --surface-2: #18301F; --ink: #E7F0E8; --muted: #93A798;
  --line: #26402F; --frame: #4FB07C; --green: #5CCB8E; --hero: #0D3A22; --gold: #E2B55E;
  --red: #FF7A6E; --wrong-bg: #4A1E1B; --peer: #17301F; --same: #4A3C16; --sel: #6B5415;
  --sand: #C79A5E; --sand-d: #8E6330; --palm: #2F9A5F; --palm-d: #1E7044; --ink-soft: #0A120D;
  --sadu-bg: #070A08; --brass: #E2B55E; --brass-d: #A67A28;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--hero); z-index: 10;
}
button { font: inherit; color: inherit; }
.wrap {
  max-width: 480px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* drawing colours */
.c-sand { fill: var(--sand); } .c-sandd { fill: var(--sand-d); }
.c-palm { fill: var(--palm); } .c-palmd { fill: var(--palm-d); }
.c-gold { fill: var(--gold); } .c-ink { fill: var(--ink-soft); }
.c-date { fill: var(--date); }
.c-brass { fill: var(--brass); } .c-brassd { fill: var(--brass-d); }
.c-hero { fill: var(--hero-ink); } .c-red { fill: var(--red); } .c-sadu { fill: var(--sadu-bg); }
.s-brassd { stroke: var(--brass-d); fill: none; }

/* header */
.hero { background: var(--hero); color: var(--hero-ink); padding-top: 18px; }
.hero .kicker { margin: 0 0 2px; font-size: 14px; opacity: .85; letter-spacing: .02em; }
.hero h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(38px, 12vw, 54px); line-height: 1.15; text-wrap: balance;
}
.scene { display: block; width: 100%; height: 130px; }
.sadu { display: block; width: 100%; height: 26px; }

main { padding-block: 18px 8px; display: grid; gap: 14px; }

/* status row */
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px;
  background: var(--surface-2); border: 0; border-radius: 999px; color: var(--ink);
  font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
}
button.chip { cursor: pointer; font-family: var(--font-display); font-size: 17px; }
.chip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* board */
.board {
  container-type: inline-size;
  display: grid; grid-template-columns: repeat(9, 1fr);
  width: 100%; max-width: 440px; margin-inline: auto; aspect-ratio: 1;
  background: var(--surface); border: 3px solid var(--frame); border-radius: 6px; overflow: hidden;
}
.cell {
  position: relative; display: grid; place-items: center; padding: 0; min-width: 0;
  background: transparent; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  border-radius: 0; cursor: pointer;
  font-family: var(--font-display); font-size: 24px; font-size: 6.4cqw; line-height: 1;
  color: var(--green); font-weight: 500; font-variant-numeric: tabular-nums;
}
.cell.bx { border-right: 2px solid var(--frame); }
.cell.by { border-bottom: 2px solid var(--frame); }
.cell.lastc { border-right: 0; }
.cell.lastr { border-bottom: 0; }
.cell.given { color: var(--ink); font-weight: 700; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--sel); box-shadow: inset 0 0 0 2px var(--gold); }
.cell.wrong { color: var(--red); background: var(--wrong-bg); }
.cell:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; z-index: 1; }
.notes {
  position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  font-size: 2.7cqw; font-weight: 500; color: var(--muted); pointer-events: none;
}
.notes i { font-style: normal; display: grid; place-items: center; }

/* number pad */
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; max-width: 440px; width: 100%; margin-inline: auto; }
.num {
  position: relative; height: 54px; padding: 0 0 6px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer; font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--ink);
}
.num small {
  position: absolute; left: 0; right: 0; bottom: 3px; font-family: var(--font-body); font-size: 10px; font-weight: 500;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.num:active { background: var(--sel); }
.num.full { opacity: .35; pointer-events: none; }
.num:focus-visible, .act:focus-visible, .chip:focus-visible, .link:focus-visible, .primary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* actions */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 440px; width: 100%; margin-inline: auto; }
.act {
  display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; background: var(--surface-2);
  border: 0; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.act svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act[aria-pressed="true"] { background: var(--green); color: var(--surface); }
.link {
  justify-self: center; background: none; border: 0; padding: 8px 12px; color: var(--muted);
  font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}

/* heritage */
.heritage h2 { margin: 6px 0 10px; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.card { margin: 0; padding: 14px 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
.card svg { display: block; height: 92px; width: auto; margin: 0 auto 8px; }
.card b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 2px; }
.card span { display: block; font-size: 12.5px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
.foot { margin-top: 22px; }

/* win */
.win {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(6, 22, 13, .72);
}
.win[hidden] { display: none; }
.win-card { width: min(100%, 360px); padding: 22px 20px 18px; background: var(--surface); border-radius: 16px; text-align: center; border-top: 6px solid var(--gold); }
.win-card svg { height: 110px; width: auto; display: block; margin: 0 auto 6px; }
.win-card h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--green); }
.win-card p { margin: 0 0 16px; color: var(--muted); }
.win-card .row { display: grid; gap: 8px; }
.primary { min-height: 46px; background: var(--green); color: var(--surface); border: 0; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; }
.win-card .link { justify-self: center; }

@media (prefers-reduced-motion: no-preference) {
  .win-card svg { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
}
</style>

<header class="hero">
  <div class="wrap">
    <p class="kicker">اللغز الأول · مستوى سهل</p>
    <h1>سودوكو الديرة</h1>
  </div>
  <svg class="scene" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax meet" role="img" aria-label="رسمة لحي طيني ونخيل وكثبان رمل">
    <circle cx="332" cy="34" r="17" class="c-gold"/>
    <path d="M-1000 130 L-1000 94 C-700 82 -400 100 -100 96 C100 92 200 80 330 90 C450 98 700 86 1400 94 L1400 130Z" class="c-sandd"/>

    <path d="M-1000 130 L-1000 114 C-600 106 -200 120 120 114 C260 110 330 106 440 112 C700 120 1000 110 1400 114 L1400 130Z" class="c-sand"/>

<main class="wrap" dir="rtl" lang="ar">
  <div class="meta">
    <span class="chip" id="time" aria-label="الوقت">٠٠:٠٠</span>
    <span class="chip" id="left"></span>
    <button class="chip" id="digits" type="button" aria-label="تبديل شكل الأرقام">١٢٣</button>
  </div>

  <div class="board" id="board" dir="ltr" role="grid" aria-label="لوحة السودوكو"></div>

  <div class="pad" id="pad" dir="ltr"></div>

  <div class="actions">
    <button class="act" id="undo" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>تراجع
    </button>
    <button class="act" id="erase" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 17l9-9 6 6-5 5H7z"/><path d="M12 19h8"/></svg>مسح
    </button>

      <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>ملاحظات
    </button>

      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>تلميح

<script>
(function () {
  var PUZ = "605908003918047000000050000781403500009070300004000060090026704806001020500800601";
  var SOL = "625918473918347256437652819781463592269175348354289167193526784846731925572894631";
  var KEY = "sudoku-diyra-v1";
  var AR = "٠١٢٣٤٥٦٧٨٩";
  var GIVEN = [], SOLN = [], i;
  for (i = 0; i < 81; i++) { GIVEN.push(PUZ[i] !== "0"); SOLN.push(+SOL[i]); }

  var st = { v: [], n: [], sel: -1, notesMode: false, hints: 0, secs: 0, arabic: false, done: false, undo: [] };

  function $(s) { return document.querySelector(s); }
  function fmt(s) { s = String(s); return st.arabic ? s.replace(/\d/g, function (d) { return AR[d]; }) : s; }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function timeStr(s) { return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60); }

  function fresh() {
    st.v = []; st.n = [];
    for (var k = 0; k < 81; k++) { st.v.push(+PUZ[k]); st.n.push(0); }
    st.hints = 0; st.secs = 0; st.done = false; st.undo = []; st.notesMode = false;
    st.sel = st.v.indexOf(0);
  }
  function load() {
    fresh();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || o.v.length !== 81 || o.n.length !== 81) return;
      for (var k = 0; k < 81; k++) { if (GIVEN[k] && o.v[k] !== +PUZ[k]) return; }
      st.v = o.v; st.n = o.n; st.hints = o.h | 0; st.secs = o.s | 0; st.arabic = !!o.a; st.done = !!o.d;
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: st.v, n: st.n, h: st.hints, s: st.secs, a: st.arabic, d: st.done }));
    } catch (e) {}
  }

  /* build board */
  var boardEl = $("#board"), cells = [], base = [];
  for (i = 0; i < 81; i++) {
    var r = Math.floor(i / 9), c = i % 9, b = document.createElement("button");
    b.type = "button"; b.dataset.i = i;
    var cls = "cell";
    if (c % 3 === 2 && c < 8) cls += " bx";
    if (r % 3 === 2 && r < 8) cls += " by";
    if (c === 8) cls += " lastc";
    if (r === 8) cls += " lastr";
    if (GIVEN[i]) cls += " given";
    base.push(cls); cells.push(b); boardEl.appendChild(b);
  }
  boardEl.addEventListener("click", function (e) {
    var t = e.target.closest(".cell");
    if (t) { st.sel = +t.dataset.i; render(); }
  });

  /* build pad */
  var padEl = $("#pad"), nums = [];
  for (var d = 1; d <= 9; d++) {
    var nb = document.createElement("button");
    nb.type = "button"; nb.className = "num"; nb.dataset.d = d;
    padEl.appendChild(nb); nums.push(nb);
  }
  padEl.addEventListener("click", function (e) {
    var t = e.target.closest(".num");
    if (t) place(+t.dataset.d);
  });

  function peers(a, b) {
    var ra = Math.floor(a / 9), ca = a % 9, rb = Math.floor(b / 9), cb = b % 9;
    return ra === rb || ca === cb || (Math.floor(ra / 3) === Math.floor(rb / 3) && Math.floor(ca / 3) === Math.floor(cb / 3));
  }

  function render() {
    var sel = st.sel, sv = sel >= 0 ? st.v[sel] : 0, wrongCount = 0;
    for (var k = 0; k < 81; k++) {
      var el = cells[k], v = st.v[k], cls = base[k];
      if (v && v !== SOLN[k]) { cls += " wrong"; }
      if (v !== SOLN[k]) wrongCount++;
      if (sel >= 0) {
        if (k === sel) cls += " sel";
        else if (sv && v === sv) cls += " same";
        else if (peers(k, sel)) cls += " peer";
      }
      el.className = cls;
      var html = "";
      if (v) html = fmt(v);
      else if (st.n[k]) {
        html = '<span class="notes">';
        for (var q = 1; q <= 9; q++) html += "<i>" + ((st.n[k] >> (q - 1)) & 1 ? fmt(q) : "") + "</i>";
        html += "</span>";
      }
      el.innerHTML = html;
      var rr = Math.floor(k / 9) + 1, cc = (k % 9) + 1;
      el.setAttribute("aria-label", "صف " + rr + " عمود " + cc + "، " + (v ? v + (GIVEN[k] ? " ثابت" : "") : "فارغة"));
    }
    for (var m = 0; m < 9; m++) {
      var cnt = 0;
      for (var j = 0; j < 81; j++) if (st.v[j] === m + 1) cnt++;
      var rem = Math.max(0, 9 - cnt);
      nums[m].innerHTML = fmt(m + 1) + "<small>" + fmt(rem) + "</small>";
      nums[m].classList.toggle("full", rem === 0);
      nums[m].setAttribute("aria-label", "الرقم " + (m + 1) + "، باقي " + rem);
    }
    $("#left").textContent = "باقي " + fmt(wrongCount) + " خانة";
    $("#time").textContent = fmt(timeStr(st.secs));
    $("#digits").textContent = st.arabic ? "123" : "١٢٣";
    var nbtn = $("#notes");
    nbtn.setAttribute("aria-pressed", st.notesMode ? "true" : "false");
  }

  function pushUndo() {
    st.undo.push({ v: st.v.slice(), n: st.n.slice() });
    if (st.undo.length > 200) st.undo.shift();
  }
  function clearPeerNotes(i0, dg) {
    var bit = ~(1 << (dg - 1));
    for (var k = 0; k < 81; k++) if (k !== i0 && peers(k, i0)) st.n[k] &= bit;
  }
  function after() { render(); save(); checkWin(); }

  function place(dg) {
    var k = st.sel;
    if (k < 0 || GIVEN[k] || st.done) return;
    if (st.notesMode) {
      if (st.v[k]) return;
      pushUndo(); st.n[k] ^= (1 << (dg - 1));
    } else {
      pushUndo();
      if (st.v[k] === dg) { st.v[k] = 0; }
      else { st.v[k] = dg; st.n[k] = 0; clearPeerNotes(k, dg); }
    }
    after();
  }
  function erase() {
    var k = st.sel;
    if (k < 0 || GIVEN[k] || st.done) return;
    if (!st.v[k] && !st.n[k]) return;
    pushUndo(); st.v[k] = 0; st.n[k] = 0; after();
  }
  function undo() {
    if (st.done) return;
    var s = st.undo.pop();
    if (!s) return;
    st.v = s.v; st.n = s.n; after();
  }
  function hint() {
    if (st.done) return;
    var k = st.sel;
    if (k < 0 || GIVEN[k] || st.v[k] === SOLN[k]) {
      k = -1;
      for (var q = 0; q < 81; q++) if (!GIVEN[q] && st.v[q] !== SOLN[q]) { k = q; break; }
    }
    if (k < 0) return;
    pushUndo();
    st.v[k] = SOLN[k]; st.n[k] = 0; clearPeerNotes(k, SOLN[k]);
    st.hints++; st.sel = k; after();
  }

  function checkWin() {
    if (st.done) return;
    for (var k = 0; k < 81; k++) if (st.v[k] !== SOLN[k]) return;
    st.done = true; save(); showWin();
  }
  function showWin() {
    var h = st.hints === 0 ? "وبدون أي تلميح" : "وبـ " + fmt(st.hints) + (st.hints === 1 ? " تلميح" : " تلميحات");
    $("#win-text").textContent = "حليتها في " + fmt(timeStr(st.secs)) + " " + h + ".";
    $("#win").hidden = false;
    $("#again").focus();
  }
  function restart() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    fresh(); $("#win").hidden = true; render(); save();
  }

  /* controls */
  $("#undo").addEventListener("click", undo);
  $("#erase").addEventListener("click", erase);
  $("#hint").addEventListener("click", hint);
  $("#notes").addEventListener("click", function () { st.notesMode = !st.notesMode; render(); });
  $("#digits").addEventListener("click", function () { st.arabic = !st.arabic; render(); save(); });
  $("#again").addEventListener("click", restart);
  $("#close").addEventListener("click", function () { $("#win").hidden = true; });

  var rbtn = $("#restart"), rtimer = null, confirming = false;
  function resetRestartLabel() { confirming = false; rbtn.textContent = "ابدأ من جديد"; }
  rbtn.addEventListener("click", function () {
    if (!confirming) {
      confirming = true; rbtn.textContent = "اضغط مرة ثانية للتأكيد";
      clearTimeout(rtimer); rtimer = setTimeout(resetRestartLabel, 3000);
    } else { clearTimeout(rtimer); resetRestartLabel(); restart(); }
  });

  document.addEventListener("keydown", function (e) {
    if (!$("#win").hidden) return;
    var key = e.key;
    if (key >= "1" && key <= "9") { place(+key); e.preventDefault(); }
    else if (key === "Backspace" || key === "Delete" || key === "0") { erase(); e.preventDefault(); }
    else if (key === "n" || key === "N") { st.notesMode = !st.notesMode; render(); }
    else if (key.indexOf("Arrow") === 0) {
      var s = st.sel < 0 ? 0 : st.sel, r0 = Math.floor(s / 9), c0 = s % 9;
      if (key === "ArrowUp") r0 = Math.max(0, r0 - 1);
      if (key === "ArrowDown") r0 = Math.min(8, r0 + 1);
      if (key === "ArrowLeft") c0 = Math.max(0, c0 - 1);
      if (key === "ArrowRight") c0 = Math.min(8, c0 + 1);
      st.sel = r0 * 9 + c0; render(); cells[st.sel].focus(); e.preventDefault();
    }
  });

  setInterval(function () {
    if (st.done || document.hidden) return;
    st.secs++;
    $("#time").textContent = fmt(timeStr(st.secs));
    if (st.secs % 5 === 0) save();
  }, 1000);

  load();
  render();
  if (st.done) showWin();
})();
</script>
</body></html>
